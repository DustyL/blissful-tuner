[preset]
name = "Test AdamW with Extra"
slug = "test_adamw_extra"

[optimizer]
optimizer_type = "adamw"
learning_rate = 5e-5
optimizer_args = ["betas=(0.9, 0.99)", "weight_decay=0.01"]
lr_scheduler = "cosine_with_min_lr"
lr_warmup_steps = 100

[network]
network_dim = 64
network_alpha = 32

[training]
max_train_steps = 2000
save_every_n_steps = 250
seed = 42
mixed_precision = "bf16"

[training.extra]
some_new_flag = true
experimental_option = "fast"
