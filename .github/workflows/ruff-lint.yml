name: Ruff Lint

on:
  pull_request:
    branches:
      - main
  push:
    paths:
      - "src/musubi_tuner/**/*.py"
      - "src/musubi_tuner/**/*.pth"
      - ".python-version"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      # astral-sh actions stopped publishing minor tags as of setup-uv v8 /
      # ruff-action v4 — pin to full immutable versions per their security
      # guidance (https://github.com/astral-sh/setup-uv/releases/tag/v8.0.0).
      - name: "Install uv"
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --dev

      - name: "Run Ruff check"
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: >
            check --fix

      - name: "Run Ruff format check"
        uses: astral-sh/ruff-action@v4.0.0
        with:
          args: >
            format --check
          # will exit with a non-zero code if there are formatting changes

      # - name: Minimize uv cache
      #   run: uv cache prune --ci
