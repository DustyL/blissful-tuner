# =============================================================================
# Persona: ELLE
# =============================================================================
# Female subject persona for LoRA identity training.
#
# Dataset details:
#   - 461 images with weighted masks (461 masks)
#   - 4-tier weighted masks: Face=255, Body=128, Hair=80, Background=0
#   - Captions co-located as .txt files
#   - Nested directory layout: ELLE-1328/ELLE-1328/
#
# Primary architecture:
#   - Qwen-Image-2512 (1328x1328)
# =============================================================================

[persona]
name = "ELLE"
trigger_word = "ELLE"

[dataset]
image_directory = "${machine.datasets_dir}/ELLE-1328/ELLE-1328/subject"
mask_directory = "${machine.datasets_dir}/ELLE-1328/ELLE-1328/weighted_masks"
use_masks = true
resolutions = [[1328, 1328]]
