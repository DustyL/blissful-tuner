# =============================================================================
# Persona: SIENNA
# =============================================================================
# Female subject persona for LoRA identity training.
#
# Dataset details:
#   - 3512 images with weighted masks (large dataset)
#   - 4-tier weighted masks: Face=255, Body=128, Hair=80, Background=0
#   - Captions co-located as .txt files
#
# Primary architecture:
#   - Qwen-Image-2512 (1328x1328)
# =============================================================================

[persona]
name = "SIENNA"
trigger_word = "SIENNA"

[dataset]
image_directory = "${machine.datasets_dir}/SIENNA-1328/subject"
mask_directory = "${machine.datasets_dir}/SIENNA-1328/weighted_masks"
use_masks = true
resolutions = [[1328, 1328]]
